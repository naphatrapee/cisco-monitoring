global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: "snmp-router"
    metrics_path: /snmp

    params:
      auth: [public_v2]
      module: [if_mib]

    static_configs:
      - targets:
          - 192.168.164.132

    relabel_configs:
      - source_labels: [__address__]
        target_label: __param_target

      - source_labels: [__param_target]
        target_label: instance

      - target_label: __address__
        replacement: snmp-exporter:9116
